<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/logo.png"/>
  <title>Spotify - Web Player: Music for everyone</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="/Frontend/Spotify/spotify.css" rel="stylesheet">
</head>
<body>
  <div class="main">
    

    <div class="sidebar">
     

      <div class="library">
        <div class="options">
          <div class="lib-options nav-option">
            <img src="/IMG/unam.png">
            
          </div>
           
          <div class="icons">
            <i class="fa-solid fa-plus"></i>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
        <div class="lib-box">
          
            
            <button class="badge">Dashboard</button>
          
        </div>
        <div>
            <button class="badge">Generar Reporte</button>
            
          
        </div>
      </div>
    </div>
    <div class="main-content">
      <div class="sticky-nav">
        <h2>Planta de Tratamiento de Aguas Residuales</h2>
      <!-- Sección de Tarjetas/Indicadores -->
    <section class="cards">
        <div class="card">
          <h3>Caudal de Entrada</h3>
          <p>250 L/min</p>
        </div>
        <div class="card">
          <h3>Caudal de Salida</h3>
          <p>230 L/min</p>
        </div>
        <div class="card">
          <h3>Nivel de pH</h3>
          <p>7.2</p>
        </div>
        <div class="card">
          <h3>Turbidez</h3>
          <p>3 NTU</p>
        </div>
      </section>

      <section class="detail-section">
        <h2>Estado del Proceso</h2>
        <div class="progress-bar">
          <div class="progress" style="width: 80%;">
            80%
          </div>
        </div>
        <p>El agua está siendo purificada para uso de riego en áreas verdes.</p>
      </section>
     </div>

      

     

      
      
     
      <div class="control"></div>
    </div>
  
</body>
</html>
