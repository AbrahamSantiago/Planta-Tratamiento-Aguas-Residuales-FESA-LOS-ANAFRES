<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 2.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #f8f8f8;
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .carousel-container {
            padding: 30px;
            text-align: center;
        }

        .carousel-title {
            color: #1a2a6c;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .carousel {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            height: 450px;
        }

        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }

        .carousel-item {
            min-width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 15px;
        }

        .carousel-btn {
            background: #1a2a6c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .carousel-btn:hover {
            background: #0f1a4a;
            transform: translateY(-2px);
        }

        .indicators {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background-color: #1a2a6c;
            transform: scale(1.2);
        }

        .admin-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: white;
            color: #1a2a6c;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .admin-link:hover {
            background: #f8f8f8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .carousel {
                height: 350px;
            }
        }

        @media (max-width: 480px) {
            .carousel {
                height: 250px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-images"></i> Carrusel de Imágenes</h1>
            <p class="subtitle">Explora nuestra galería de imágenes. Haz clic en cualquier imagen para ver más detalles.</p>
        </header>

        <!-- Vista del Carrusel -->
        <section id="carousel-view">
            <div class="carousel-container">
                <h2 class="carousel-title">Galería de Destinos</h2>
                <div class="carousel">
                    <div class="carousel-inner" id="carousel-inner">
                        <!-- Las imágenes del carrusel se cargarán aquí con JavaScript -->
                    </div>
                </div>
                <div class="carousel-controls">
                    <button class="carousel-btn" id="prev-btn">
                        <i class="fas fa-chevron-left"></i> Anterior
                    </button>
                    <button class="carousel-btn" id="next-btn">
                        Siguiente <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="indicators" id="indicators">
                    <!-- Los indicadores se generarán con JavaScript -->
                </div>
                <a href="admin.html" class="admin-link">
                    <i class="fas fa-cog"></i> Ir al Panel de Administración
                </a>
            </div>
        </section>
    </div>

    <script>
        // Obtener datos del carrusel desde localStorage
        let carouselData = JSON.parse(localStorage.getItem('carouselData')) || [
            {
                id: 1,
                url: "https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80",
                link: "https://es.wikipedia.org/wiki/Monta%C3%B1a",
                title: "Montañas Verdes",
                description: "Las montañas verdes ofrecen paisajes impresionantes con su exuberante vegetación y vistas panorámicas. Ideal para senderismo, camping y fotografía de naturaleza. La región cuenta con rutas para todos los niveles de experiencia."
            },
            {
                id: 2,
                url: "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80",
                link: "https://es.wikipedia.org/wiki/Lago",
                title: "Atardecer en el Lago",
                description: "Disfruta de atardeceres inolvidables en este lago cristalino. Perfecto para actividades acuáticas como kayak, natación y pesca. El lago también ofrece áreas de picnic y observación de aves para toda la familia."
            },
            {
                id: 3,
                url: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80",
                link: "https://es.wikipedia.org/wiki/Bosque",
                title: "Bosque Montañoso",
                description: "Explora este bosque montañoso lleno de vida silvestre y senderos naturales. Con más de 50 km de rutas marcadas, es un paraíso para excursionistas y amantes de la naturaleza. La diversidad de flora y fauna es impresionante."
            }
        ];

        // Elementos del DOM
        const carouselInner = document.getElementById('carousel-inner');
        const indicatorsContainer = document.getElementById('indicators');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Variables para el carrusel
        let currentIndex = 0;
        let interval;

        // Inicializar el carrusel
        function initCarousel() {
            carouselInner.innerHTML = '';
            indicatorsContainer.innerHTML = '';
            
            carouselData.forEach((item, index) => {
                // Crear elemento del carrusel
                const carouselItem = document.createElement('div');
                carouselItem.className = 'carousel-item';
                if (index === 0) carouselItem.classList.add('active');
                
                carouselItem.innerHTML = `
                    <img src="${item.url}" alt="${item.title}" class="carousel-img">
                    <div class="carousel-caption">
                        <h3>${item.title}</h3>
                        <p>${item.link ? 'Haz clic para ver detalles' : 'Sin enlace asociado'}</p>
                    </div>
                `;
                
                // Agregar evento de clic para abrir enlace
                carouselItem.addEventListener('click', () => {
                    if (item.link) {
                        window.open(item.link, '_blank');
                    }
                });
                
                carouselInner.appendChild(carouselItem);
                
                // Crear indicadores
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                if (index === 0) indicator.classList.add('active');
                indicator.dataset.index = index;
                
                indicator.addEventListener('click', () => {
                    currentIndex = index;
                    updateCarousel();
                });
                
                indicatorsContainer.appendChild(indicator);
            });
            
            // Iniciar rotación automática
            startCarousel();
        }

        // Actualizar carrusel
        function updateCarousel() {
            const items = document.querySelectorAll('.carousel-item');
            const indicators = document.querySelectorAll('.indicator');
            
            // Ocultar todos los items
            items.forEach(item => item.classList.remove('active'));
            indicators.forEach(indicator => indicator.classList.remove('active'));
            
            // Mostrar item actual
            items[currentIndex].classList.add('active');
            indicators[currentIndex].classList.add('active');
            
            // Actualizar posición
            carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        // Iniciar rotación automática
        function startCarousel() {
            clearInterval(interval);
            interval = setInterval(() => {
                currentIndex = (currentIndex + 1) % carouselData.length;
                updateCarousel();
            }, 5000);
        }

        // Eventos de navegación
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + carouselData.length) % carouselData.length;
            updateCarousel();
            startCarousel();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % carouselData.length;
            updateCarousel();
            startCarousel();
        });

        // Inicializar el carrusel al cargar la página
        document.addEventListener('DOMContentLoaded', initCarousel);
    </script>
</body>
</html>
