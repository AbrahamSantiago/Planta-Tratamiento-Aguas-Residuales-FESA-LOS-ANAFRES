<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Usuarios - Planta de Tratamiento</title>
  <link rel="stylesheet" href="ControlUsuarios.css">

</head>
<body>


  <header>
  <div class="header-gradient"></div>
  <div class="header-container">
    <div class="logo-container">
      <img src="/IMG/logo_fesa2.png" alt="UNAM" class="logo logo-unam">
      <h1 class="header-title text-center">Gestión de Usuarios</h1>
      <img src="/IMG/logoPTAR-Photoroom.png" alt="PTAR" class="logo logo-ptar">
    </div>
  </div>
</header>

  
  <div class="container">

    <!-- Formulario de Alta de Usuario -->
    <form id="userForm">
      <div>
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez"/>
      </div>
      <div>
        <label for="usuario">NombreUsuario</label>
        <input type="text" id="usuario" required placeholder="Ej. j.perez" />
      </div>
      <div>
        <label for="contraseña">Contraseña Acceso</label>
        <input type="text" id="usuario" required placeholder="Ej. j.perez" />
      </div>
      <div>
        <label for="rol">Rol</label>
        <select id="rol" required>
          <option value="">--Selecciona un rol--</option>
          <option value="Direccion">Director/a</option>
          <option value="Administrador">Administrador</option>
          <option value="Docente">Docente</option>
          <option value="DesarrolladorWeb">Desarrollador Web</option>
          <option value="DiseñadorGrafico">DiseñadorGrafico</option>
          <option value="Comunicacion">Comunicación</option>

        </select>
      </div>
      <button type="submit">Agregar Usuario</button>
    </form>

    <!-- Tabla de Usuarios -->
    <table id="tablaUsuarios">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Contraseña</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se cargan filas vía JavaScript -->
      </tbody>
    </table>

  </div>

  <script>
    // Array local de ejemplo (en la práctica, vendría de una BD o API)
    let usuarios = [
      { id: 1, nombre: "María López", usuario: "mlopez", contraseña:"1234" ,rol: "Administrador", estado: "activo" },
      { id: 2, nombre: "Carlos Méndez", usuario: "cmendez", rol: "Operador", estado: "activo" },
      { id: 3, nombre: "Ana Ruiz", usuario: "aruiz", rol: "Invitado", estado: "inactivo" },
    ];

    const userForm = document.getElementById('userForm');
    const tablaUsuarios = document.getElementById('tablaUsuarios').getElementsByTagName('tbody')[0];

    // Renderizar la tabla al cargar la página
    window.addEventListener('DOMContentLoaded', renderTabla);

    // Maneja el "submit" del formulario para agregar un nuevo usuario
    userForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const usuario = document.getElementById('usuario').value;
      const rol = document.getElementById('rol').value;
      const contraseña = document.getElementById('contraseña').value;

      // Generar un ID sencillo (único) para el nuevo usuario
      const nuevoID = usuarios.length > 0 ? usuarios[usuarios.length - 1].id + 1 : 1;

      // Crear objeto usuario
      const nuevoUsuario = {
        id: nuevoID,
        nombre,
        usuario,
        contraseña,
        rol,
        estado: "activo"  // Por defecto, nuevo usuario en "activo"
      };

      // Agregar al array
      usuarios.push(nuevoUsuario);

      // Renderizar de nuevo la tabla para incluir el nuevo usuario
      renderTabla();

      // Limpiar el formulario
      userForm.reset();
    });

    // Función para dibujar la tabla
    function renderTabla() {
      // Limpiar el contenido anterior del tbody
      tablaUsuarios.innerHTML = '';

      // Generar filas
      usuarios.forEach(user => {
        const fila = tablaUsuarios.insertRow();

        // Celdas
        const celdaNombre = fila.insertCell(0);
        const celdaUsuario = fila.insertCell(1);
        const celdaContraseña= fila.insrtCell(2)
        const celdaRol = fila.insertCell(3);
        const celdaEstado = fila.insertCell(4);
        const celdaAcciones = fila.insertCell(5);

        // Asignar valores
        celdaNombre.textContent = user.nombre;
        celdaUsuario.textContent = user.usuario;
        celdaRol.textContent = user.rol;
        celdaContraseña.textContent = user.contraseña
        
        // Mostrar estado con estilo
        celdaEstado.textContent = user.estado === "activo" ? "Activo" : "Inactivo";
        celdaEstado.classList.add(user.estado);

        // Botones de acción (eliminar y cambiar estado)
        celdaAcciones.classList.add("acciones");

        // Botón eliminar
        const btnEliminar = document.createElement('button');
        btnEliminar.textContent = "Eliminar";
        btnEliminar.addEventListener('click', () => eliminarUsuario(user.id));

        // Botón cambiar estado
        const btnEstado = document.createElement('button');
        btnEstado.textContent = "Cambiar Estado";
        btnEstado.classList.add("toggle-estado");
        btnEstado.addEventListener('click', () => toggleEstado(user.id));

        celdaAcciones.appendChild(btnEliminar);
        celdaAcciones.appendChild(btnEstado);
      });
    }

    // Eliminar usuario
    function eliminarUsuario(id) {
      usuarios = usuarios.filter(u => u.id !== id);
      renderTabla();
    }

    // Cambiar entre activo e inactivo
    function toggleEstado(id) {
      usuarios = usuarios.map(u => {
        if(u.id === id) {
          u.estado = (u.estado === "activo") ? "inactivo" : "activo";
        }
        return u;
      });
      renderTabla();
    }
  </script>
</body>
</html>
